# Code Review Assistant for a repository with several languages.
#
# CRA analyzes one language per run, so use a matrix. With `language` set, the
# action names the code scanning category and report artifact after it
# (cra-go, cra-report-go, ...), which keeps the matrix jobs from colliding.

name: CRA

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # report every language even if one fails the check
      matrix:
        include:
          - language: go
            path: .
          - language: javascript
            path: web
          - language: python
            path: tools
    steps:
    - uses: actions/checkout@v6

    # @v1 follows the latest 1.x release. For reproducible runs, pin a release
    # (@v1.6.0) or a commit SHA instead.
    - uses: daniel-munoz/code-review-assistant@v1
      with:
        language: ${{ matrix.language }}
        path: ${{ matrix.path }}
