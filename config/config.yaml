# Code Review Assistant - Configuration File

# Language selection (auto, go, python, javascript, kotlin)
language: auto

analysis:
  # Patterns to exclude from analysis (glob patterns)
  exclude_patterns:
    - "vendor/**"
    - "**/*_test.go"
    - "**/testdata/**"
    - "**/*.pb.go"        # Generated protobuf files
    - "**/*_gen.go"       # Generated Go files
    - "**/*.gen.go"       # Generated Go files

  # Thresholds for issue detection
  large_file_threshold: 500      # Lines - files exceeding this are flagged
  long_function_threshold: 50    # Lines - functions exceeding this are flagged
  min_comment_ratio: 0.15        # 15% - minimum recommended comment ratio
  complexity_threshold: 10       # Cyclomatic complexity - functions exceeding this are flagged

  # Anti-pattern detection
  max_parameters: 5              # Maximum function parameters before flagging
  max_nesting_depth: 4           # Maximum nesting depth before flagging
  max_return_statements: 3       # Maximum return statements per function
  detect_magic_numbers: true     # Detect numeric literals (excluding 0, 1, -1)
  detect_duplicate_errors: true  # Detect repetitive error handling patterns
  detect_non_null_assertions: true # Detect !! usage (Kotlin)
  detect_run_blocking: true      # Detect runBlocking outside main (Kotlin)

  # Test coverage
  enable_coverage: true          # Run test coverage (go test -cover, Jest/Vitest, Gradle Kover/JaCoCo)
  min_coverage_threshold: 50.0   # Minimum coverage percentage (0-100)
  coverage_timeout_seconds: 30   # Timeout: per package (Go); whole test run (JS, Kotlin/Gradle — use 300+ for cold Gradle builds)

  # Dependency analysis
  max_imports: 10                # Maximum imports per package before flagging
  max_external_dependencies: 10  # Maximum external dependencies per package
  detect_circular_deps: true     # Detect circular dependencies between packages

output:
  format: "console"               # Output format: console, markdown, json
  verbose: false                  # Show detailed per-file metrics
  output_file: ""                 # Phase 3: Write to file instead of stdout (empty = stdout)
  json_pretty: true               # Phase 3: Pretty-print JSON output

# Phase 3: Storage configuration
storage:
  enabled: false                  # Enable persistent storage for historical tracking
  backend: "file"                 # Storage backend: file (JSON) or sqlite
  path: ""                        # Custom storage path (empty = default: ~/.cra)
  auto_save: false                # Automatically save reports after analysis
  project_mode: false             # Use ./.cra instead of ~/.cra for project-specific storage

# Phase 3: Comparison configuration
comparison:
  enabled: false                  # Enable comparison with previous reports
  auto_compare: false             # Automatically compare with latest report
  stable_threshold: 5.0           # Percentage change threshold for "stable" trend (default: 5%)
