# Moves the major version tag (v1, v2, ...) to each new release, so workflows
# using `daniel-munoz/code-review-assistant@v1` pick up the latest 1.x release.
#
# Pre-releases and tags that aren't vMAJOR.MINOR.PATCH are skipped, and the tag
# only moves forward: releasing v1.5.3 after v1.6.0 leaves v1 on v1.6.0.

name: Move major version tag

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to point its major tag at (e.g. v1.6.0)
        required: true

permissions:
  contents: write

jobs:
  move-tag:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Move major tag
      env:
        TAG: ${{ github.event.release.tag_name || inputs.tag }}
      run: |
        if [[ ! "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
          echo "Skipping $TAG: not a vMAJOR.MINOR.PATCH release"
          exit 0
        fi
        major="v${BASH_REMATCH[1]}"

        latest=$(git tag --list "$major.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
        if [ "$TAG" != "$latest" ]; then
          echo "Skipping $TAG: $latest is newer, $major stays put"
          exit 0
        fi

        git tag -f "$major" "$TAG^{commit}"
        git push -f origin "refs/tags/$major"
        echo "Moved $major to $TAG ($(git rev-parse --short "$TAG^{commit}"))" >> "$GITHUB_STEP_SUMMARY"
