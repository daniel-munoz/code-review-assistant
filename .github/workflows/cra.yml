# Runs Code Review Assistant on the files a pull request changes and uploads
# the findings to GitHub code scanning, which shows them as inline PR
# annotations. It uses the action from the PR's own checkout, so CRA and its
# GitHub Action review themselves.

name: CRA

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:

  analyze:
    runs-on: ubuntu-latest
    steps:
    # Default shallow checkout on purpose: the action fetches the history
    # --branch needs, and this exercises that path.
    - uses: actions/checkout@v6

    - name: Analyze changed files
      uses: ./
